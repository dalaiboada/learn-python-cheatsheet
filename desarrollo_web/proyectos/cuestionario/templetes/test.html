<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style_quiz.css') }}"
    />
    <title>Test</title>
  </head>
  <body>
    <!-- Formas abstractas de fondo -->
    <div class="background-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <!-- Barra de navegación -->
    <nav class="navbar">
      <div class="logo">
        <i class="bi bi-patch-question-fill"></i>
        Quiz
      </div>
    </nav>

    <!-- Contenido principal -->
    <main class="main-content">
      <h1 class="question-title">{{ pregunta }}</h1>

      <form method="post" action="test" class="quiz-form">
        <!-- Input oculto original -->
        <input type="hidden" name="q_id" value="{{quest_id}}" />

        <!-- Bucle para las respuestas -->
        {% for respuesta in lista_respuestas %}
        <label class="custom-radio">
          <input
            type="radio"
            name="ans_text"
            value="{{ respuesta }}"
            required
          />

          <div class="radio-label">
            <div class="radio-indicator"></div>

            <span>{{ respuesta }}</span>
          </div>
        </label>
        {% endfor %}

        <div class="submit-container">
          <button type="submit" class="btn-submit">
            Responder
            <i class="bi bi-arrow-right"></i>
          </button>
        </div>
      </form>
    </main>

    <!-- Pie de página -->
    <footer class="footer">
      <p>&copy; 2026 App de Cuestionarios. Buena suerte.</p>
    </footer>
  </body>
</html>
