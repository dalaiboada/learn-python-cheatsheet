<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style_quiz.css') }}"
    />
    <title>Test</title>
  </head>
  <body>
    <!-- Formas abstractas de fondo -->
    <div class="background-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <!-- Barra de navegación -->
    <nav class="navbar">
      <div class="logo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"
          />
        </svg>
        Quiz
      </div>
    </nav>

    <!-- Contenido principal -->
    <main class="main-content">
      <h1 class="question-title">{{ pregunta }}</h1>

      <form method="post" action="test" class="quiz-form">
        <!-- Input oculto original -->
        <input type="hidden" name="q_id" value="{{quest_id}}" />

        <!-- Bucle para las respuestas -->
        {% for respuesta in lista_respuestas %}
        <label class="custom-radio">
          <input
            type="radio"
            name="ans_text"
            value="{{ respuesta }}"
            required
          />

          <div class="radio-label">
            <div class="radio-indicator"></div>

            <span>{{ respuesta }}</span>
          </div>
        </label>
        {% endfor %}

        <div class="submit-container">
          <button type="submit" class="btn-submit">
            Responder
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </form>
    </main>

    <!-- Pie de página -->
    <footer class="footer">
      <p>&copy; 2026 App de Cuestionarios. Buena suerte.</p>
    </footer>
  </body>
</html>
