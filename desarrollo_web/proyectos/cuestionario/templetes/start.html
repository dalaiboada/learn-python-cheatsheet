<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style_quiz.css') }}"
    />
    <title>Inicio</title>
  </head>
  <body>
    <!-- Formas abstractas de fondo -->
    <div class="background-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <!-- Barra de navegación -->
    <nav class="navbar">
      <div class="logo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"
          />
        </svg>
        Quiz
      </div>
    </nav>

    <!-- Contenido principal -->
    <main class="main-content">
      <h1 class="hero-title">
        Pon a prueba tu <span class="text-gradient">conocimiento</span>
      </h1>

      <p class="hero-subtitle">
        Selecciona una categoría de la lista desplegable y descubre cuánto
        sabes. ¿Estás listo para el desafío de hoy?
      </p>

      <!-- Formulario -->
      <form method="post" action="/" class="quiz-form">
        <div class="select-wrapper">
          <select id="quiz-select" name="quiz" required class="custom-select">
            <option value="" disabled selected>
              Selecciona tu cuestionario...
            </option>

            <!-- Cuestionarios -->
            {% for id, name in lista_cuestionarios %}
            <option value="{{id}}">{{name}}</option>
            {% endfor %}
          </select>

          <div class="select-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              ></path>
            </svg>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <span>Comenzar</span>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </form>
    </main>

    <!-- Pie de página -->
    <footer class="footer">
      <p>&copy; 2026 App de Cuestionarios. Buena suerte.</p>
    </footer>
  </body>
</html>
